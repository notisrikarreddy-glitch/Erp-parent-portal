<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JUNO ERP - Advanced</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Segoe UI, Arial, sans-serif;
background:#f3f5f7;
}

.topbar{
background:#1e5f94;
color:white;
padding:15px 30px;
display:flex;
justify-content:space-between;
font-weight:600;
}

.wrapper{
padding:20px 30px;
}

.content{
display:flex;
gap:20px;
}

.sidebar{
width:30%;
background:white;
border-radius:10px;
border:1px solid #ddd;
padding:15px;
height:500px;
overflow-y:auto;
}

.course{
padding:8px;
margin:5px 0;
border-radius:6px;
cursor:pointer;
font-size:14px;
}

.course.active{
background:#dceaf5;
font-weight:600;
}

.main{
width:70%;
background:white;
border-radius:10px;
border:1px solid #ddd;
padding:20px;
}

.selected{
display:flex;
justify-content:space-between;
font-weight:600;
margin-bottom:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
font-size:14px;
}

th,td{
border-bottom:1px solid #eee;
padding:8px;
}

th{
background:#f0f2f4;
}

input{
width:70px;
padding:4px;
}

.gpa-box{
margin-top:15px;
padding:10px;
background:#eef1f4;
border-radius:6px;
font-weight:600;
}

button{
margin-top:10px;
padding:6px 12px;
background:#2f95c8;
color:white;
border:none;
border-radius:4px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
<div>JUNO Campus</div>
<div>Overall GPA: <span id="overallGPA">0.00</span></div>
</div>

<div class="wrapper">
<div class="content">

<div class="sidebar" id="courseList"></div>

<div class="main">
<div class="selected">
<div id="selectedCourse"></div>
<div>Marks: <span id="totalMarks">0</span>/100</div>
</div>

<table id="marksTable"></table>

<button onclick="saveMarks()">Save</button>

<div class="gpa-box">
Grade: <span id="grade">-</span>
</div>

</div>
</div>
</div>

<script>

const subjects = {
"HS1101 - ENGLISH":[
{name:"Mid Term II",max:20},
{name:"Assignment",max:30},
{name:"End Term",max:50}
],
"HS1103 - FRENCH-I":[
{name:"Mid Term",max:40},
{name:"End Term",max:60}
],
"CS1001 - INTRODUCTION TO COMPUTING":[
{name:"Mid Term I",max:15},
{name:"Mid Term II",max:15},
{name:"End Term",max:40},
{name:"Lab Exam",max:20},
{name:"Lab Participation",max:10}
],
"MA1101 - CALCULUS AND ODE":[
{name:"Mid Term I",max:20},
{name:"Mid Term II",max:20},
{name:"End Term",max:40},
{name:"Internal Assessment",max:20}
],
"CE1101 - EARTH AND ENVIRONMENTAL SCIENCES":[
{name:"Mid Term",max:30},
{name:"Offline Quiz",max:10},
{name:"Assignment",max:10},
{name:"End Term",max:50}
],
"EC1101 - INTRODUCTION TO ELECTRICAL AND ELECTRONICS ENGINEERING":[
{name:"Mid Term I",max:25},
{name:"Mid Term II",max:25},
{name:"Assignment",max:10},
{name:"End Term",max:40}
],
"CH1101 - QUANTAM CHEMISTRY AND SPECTROSCOPY":[
{name:"Internal Assessment",max:10},
{name:"Mid Term II",max:15},
{name:"End Term",max:40},
{name:"Lab Exam",max:20},
{name:"Mid Term",max:15}
],
"ET1101F - INTRODUCTION TO ENTREPRENEURSHIP":[
{name:"Offline Quiz",max:15},
{name:"Project",max:40},
{name:"Assignment",max:30},
{name:"Class Participation",max:15}
],
"HS1102 - MEDIA PROJECT":[
{name:"Assignment",max:30},
{name:"Project",max:70}
]
};

let selected = Object.keys(subjects)[0];
let data = JSON.parse(localStorage.getItem("erpData")) || {};

function renderCourses(){
const list=document.getElementById("courseList");
list.innerHTML="";
Object.keys(subjects).forEach(sub=>{
let div=document.createElement("div");
div.className="course";
div.innerText=sub;
if(sub===selected) div.classList.add("active");
div.onclick=()=>{selected=sub;render();};
list.appendChild(div);
});
}

function render(){
renderCourses();
document.getElementById("selectedCourse").innerText="Selected Course: "+selected;

let table=document.getElementById("marksTable");
table.innerHTML="<tr><th>Parameter</th><th>Out of</th><th>Marks</th></tr>";

let total=0;
let maxTotal=0;

subjects[selected].forEach((item,i)=>{
if(!data[selected]) data[selected]={};
if(!data[selected][i]) data[selected][i]=0;

total+=parseFloat(data[selected][i])||0;
maxTotal+=item.max;

table.innerHTML+=`
<tr>
<td>${item.name}</td>
<td>${item.max}</td>
<td><input type="number" step="0.01" value="${data[selected][i]}"
oninput="updateMark(${i},this.value)"></td>
</tr>
`;
});

document.getElementById("totalMarks").innerText=total.toFixed(2);
calculateGrade(total);
calculateOverallGPA();
}

function updateMark(index,value){
if(!data[selected]) data[selected]={};
data[selected][index]=parseFloat(value)||0;
render();
}

function calculateGrade(total){
let grade="-";
if(total>=90) grade="A+";
else if(total>=80) grade="A";
else if(total>=70) grade="B";
else if(total>=60) grade="C";
else if(total>=50) grade="D";
else grade="F";
document.getElementById("grade").innerText=grade;
}

function calculateOverallGPA(){
let totalGPA=0;
let count=0;

Object.keys(data).forEach(sub=>{
let sum=Object.values(data[sub]).reduce((a,b)=>a+(parseFloat(b)||0),0);
let gpa=0;
if(sum>=90) gpa=10;
else if(sum>=80) gpa=9;
else if(sum>=70) gpa=8;
else if(sum>=60) gpa=7;
else if(sum>=50) gpa=6;
else gpa=5;
totalGPA+=gpa;
count++;
});

document.getElementById("overallGPA").innerText=
count? (totalGPA/count).toFixed(2) : "0.00";
}

function saveMarks(){
localStorage.setItem("erpData",JSON.stringify(data));
alert("Marks Saved Successfully");
}

render();

</script>

</body>
</html>
